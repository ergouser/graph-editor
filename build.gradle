plugins {
    id 'eclipse'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'java'
    id 'application' // Add the application plugin
}

allprojects {
    group = 'com.ergotech.graph-editor'
    version = 'E19.0.0'
}

sourceCompatibility = 21
targetCompatibility = 21

repositories {
    mavenCentral()
}

ext {
    junitVersion = '4.13.2'
    orgSlf4jVersion = '2.0.11'
    orgOpenjfxVersion = '21.0.1'
    openjfxMonocleVersion = 'jdk-12.0.1+2'
}

subprojects {
    apply plugin: 'eclipse'
    apply plugin: 'java'
    apply plugin: 'org.openjfx.javafxplugin'
    apply plugin: 'maven-publish'
    apply plugin: 'application' // Add the application plugin

    java {
        withSourcesJar()
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation "junit:junit:${junitVersion}"
        implementation "org.slf4j:slf4j-api:${orgSlf4jVersion}"
        implementation 'org.slf4j:slf4j-simple:2.0.11'
        implementation "org.openjfx:javafx-controls:${orgOpenjfxVersion}"
        implementation "org.openjfx:javafx-fxml:${orgOpenjfxVersion}"
        implementation "org.openjfx:javafx-base:${orgOpenjfxVersion}"
        implementation "org.openjfx:javafx-graphics:${orgOpenjfxVersion}"
        implementation "org.openjfx:javafx-web:${orgOpenjfxVersion}"
        testImplementation "org.testfx:openjfx-monocle:${openjfxMonocleVersion}"
    }

    javafx {
        version = '21'
        modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.swing', 'javafx.web' ]
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                groupId = project.group
                version = project.version
                artifactId = "${rootProject.name}-${project.name}"
            }
        }

        repositories {
            mavenLocal()
        }
    }
}

